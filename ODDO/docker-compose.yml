services:
  odoobuild:
    build: ./odoo
    container_name: odoo14build
    restart: always
    platform: linux/amd64
    ports:
      - "8080:8069"
      - "8081:8072"
    volumes:
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/odoo-server.conf:/etc/odoo/odoo.conf
      - odoo_data:/var/lib/odoo
      - odoo_backup:/odoo-backup
    command: odoo -c /etc/odoo/odoo.conf
    depends_on:
      - pgcat
      - postgres
      - minio
    environment:
      - PGHOST=<<pgcat host>>
      - PGPORT=6432
      - PGUSER=<<pgcat user>>
      - PGPASSWORD=<<pgcat password>>
    networks:
      - odoo_net

  pgcat:
    image: pgcat64:local
    container_name: pgcat
    pull_policy: never
    platform: linux/amd64
    restart: always
    ports:
      - "6432:6432"
    volumes:
      - ./pgcat/pgcat.toml:/etc/pgcat/pgcat.toml:ro
    command: ["pgcat", "/etc/pgcat/pgcat.toml"]
    depends_on:
      - postgres
    networks:
      - odoo_net

  postgres:
    image: postgres:14
    container_name: postgres14
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: <<postgres dbname>>
      POSTGRES_USER: <<postgres user>>
      POSTGRES_PASSWORD: <<postgres password>>
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/conf/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      - ./postgres/conf/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    networks:
      - odoo_net

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: <<minio root user>>
      MINIO_ROOT_PASSWORD: <<minio root password>>
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    networks:
      - odoo_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12          # gives ~2 minutes total grace time
      start_period: 20s    # important: give MinIO time to boot before first check

volumes:
  odoo_data:
  odoo_backup:
  redis_data:
    driver: local

networks:
  odoo_net:
    driver: bridge
