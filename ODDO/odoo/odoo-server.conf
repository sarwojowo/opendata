[options]
admin_passwd = <<odoo admin password>>

db_host = pgcat
db_name = production
db_password = <<main pgcat password>>
db_port = 6432
db_sslmode = prefer
db_template = template0
db_user = <<main pgcat user>>
list_db = False

longpolling_port = 8072

workers = 30
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

max_cron_threads = 2
session_timeout = 86400

server_wide_modules=web,base,session_db
log_db = False
log_db_level = warning
log_handler = :INFO
log_level = info
logrotate = True
load=web

limit_request = 8192
limit_time_cpu = 2400
limit_time_real = 4800
proxy_mode = True
# max_connections = 4096
# db_maxconn = 240
max_connections = 200
db_maxconn = 40
