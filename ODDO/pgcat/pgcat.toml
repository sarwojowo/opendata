[general]
host = "0.0.0.0"
port = 6432
enable_prometheus_exporter = true
prometheus_exporter_port = 9931
connect_timeout = 100000 # milliseconds
# idle_timeout = 300000 # milliseconds
idle_timeout = 600000
server_lifetime = 86400000 # 24 hours
idle_client_in_transaction_timeout = 0 # 60 detik atau 0 untuk menonaktifkan
healthcheck_timeout = 1000 # milliseconds
healthcheck_delay = 30000 # milliseconds
shutdown_timeout = 60000 # milliseconds
ban_time = 60 # seconds
log_client_connections = false
log_client_disconnections = false
autoreload = 15000
# worker_threads = 10
worker_threads = 16

# tcp_keepalives_idle = 5
# tcp_keepalives_count = 5
# tcp_keepalives_interval = 5

tcp_keepalives_idle = 30         # Seconds before first probe – much better than 5s
tcp_keepalives_count = 8         # Probes before closing
tcp_keepalives_interval = 10

server_tls = false
verify_server_certificate = false
admin_username = <<admin username>>
admin_password = <<admin password>>

[status]
enabled = true
address = "0.0.0.0"
port = 9930 

[pools.postgres]
pool_mode = "transaction"
default_role = "primary"
query_parser_enabled = false
query_parser_read_write_splitting = false
primary_reads_enabled = true
sharding_function = "pg_bigint_hash"

[pools.production.users.0]
username = <<main db user>>
password = <<main db password>>
pool_size = 100
statement_timeout = 0
role = "primary"

[pools.production.users.1]
username = <<odoo user 1>>
password = <<odoo password 1>>
pool_size = 10
statement_timeout = 0
role = "primary"

[pools.production.users.2]
username = <<odoo user 2>>
password = <<odoo password 2>>
pool_size = 10
statement_timeout = 0
role = "primary"

[pools.production.users.3]
username = <<odoo user 3>>
password = <<odoo password 3>>
pool_size = 10
statement_timeout = 0
role = "primary"

[pools.production.shards.0]
servers = [
    [ "postgres14", 5432, "primary" ],
]
database = "production"